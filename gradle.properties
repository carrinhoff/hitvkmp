org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.stability.nowarn=true

# Lets the iOS Kotlin source sets be COMPILED (to klibs) on a non-Mac host.
# Linking a framework/IPA still requires Xcode, so CI is unchanged — but this means
# `./gradlew :shared:umbrella:compileKotlinIosArm64` type-checks every iosMain source set
# on Windows, catching missing actuals, bad cinterop signatures and ObjC property-setter
# mistakes before pushing. Previously those only surfaced in GitHub Actions, which made
# iosMain by far the least-validated code in the project.
kotlin.native.enableKlibsCrossCompilation=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
